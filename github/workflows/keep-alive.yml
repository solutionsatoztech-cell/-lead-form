name: Keep Supabase Alive

on:
  schedule:
    # Runs every 5 days at 5:30 AM IST (00:00 UTC) — well within the 7-day pause window
    - cron: '0 0 */5 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://wnorbyaeikvusdzesbkt.supabase.co/rest/v1/steps?select=id&limit=1" \
            -H "apikey: sb_publishable_l9_ENeEmiv59DJta1I8BGA_b7W7PXWV"
