<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#1F4E78">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lead Form</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --navy:#1F4E78; --navy-dark:#153955; --amber:#E2790E; --amber-dark:#C4650A;
    --bg:#EEF2F6; --card:#FFFFFF; --text:#1A2530; --muted:#7C8B99; --line:#E3E9EF;
    --ok:#2E7D32; --err:#C62828; --wa:#25D366;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);color:#fff;padding:26px 20px 46px;position:relative;}
  header .tag{font-size:12.5px;letter-spacing:.03em;color:#BFD4E6;margin-bottom:6px;font-weight:600;}
  header h1{margin:0 0 16px;font-size:23px;font-weight:800;}
  .tabs{display:flex;gap:8px;}
  .tab-btn{flex:1;padding:10px;border-radius:9px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;}
  .tab-btn.active{background:#fff;color:var(--navy-dark);}
  .logout-btn{position:absolute;top:22px;right:20px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  main{max-width:520px;margin:-26px auto 0;padding:0 16px 110px;position:relative;}
  .card{background:var(--card);border-radius:16px;padding:20px 18px;box-shadow:0 8px 24px rgba(20,40,60,.10);margin-bottom:16px;}
  .section-title{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:18px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .field{margin-bottom:15px;}
  .field label{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--navy-dark);margin-bottom:6px;}
  .field .req{color:var(--amber-dark);font-weight:700;}
  input,select,textarea{width:100%;padding:12.5px 13px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:#FBFCFD;color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);background:#fff;}
  textarea{min-height:64px;resize:vertical;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .footer-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(20,40,60,.06);}
  .footer-bar-inner{max-width:520px;margin:0 auto;}
  button#submitBtn{width:100%;padding:15px;font-size:16.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--amber) 0%,var(--amber-dark) 100%);border:none;border-radius:11px;cursor:pointer;box-shadow:0 4px 12px rgba(226,121,14,.35);}
  button#submitBtn:disabled{background:#C9CDD2;box-shadow:none;}
  #status{margin-top:12px;font-size:14px;text-align:center;min-height:18px;}
  #status.ok{color:var(--ok);font-weight:700;}
  #status.err{color:var(--err);font-weight:700;}
  #waBtn{display:none;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:11px;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;font-size:15px;margin-top:14px;}
  .hidden{display:none !important;}
  .lead-card{border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;}
  .lead-card.is-new{border-color:var(--amber);background:#FFF8EF;}
  .lead-card .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .lead-card .cname{font-weight:800;font-size:15px;}
  .lead-card .badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;background:var(--navy);color:#fff;}
  .lead-card .badge.new{background:var(--amber);}
  .lead-card .meta{font-size:13px;color:var(--muted);margin-bottom:2px;}
  .lead-actions{margin-top:10px;}
  .lead-actions .row2{margin-bottom:8px;}
  .lead-actions select, .lead-actions textarea{font-size:13.5px;}
  .lead-actions textarea{min-height:50px;margin-bottom:8px;}
  .lead-update-btn{width:100%;padding:10px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;}
  .lead-msg{font-size:12px;margin-top:6px;font-weight:700;}
  .lead-msg.ok{color:var(--ok);}
  .lead-msg.err{color:var(--err);}
  .summary-bar{display:flex;gap:10px;margin-bottom:14px;}
  .summary-box{flex:1;background:var(--navy);color:#fff;border-radius:12px;padding:14px;text-align:center;}
  .summary-box .num{font-size:22px;font-weight:800;}
  .summary-box .lbl{font-size:11.5px;color:#BFD4E6;}
  .summary-box.amber{background:linear-gradient(135deg,var(--amber),var(--amber-dark));}
  .summary-box.amber .lbl{color:#FFE6C7;}

  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);}
  .login-card{background:#fff;border-radius:18px;padding:32px 24px;max-width:380px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.25);}
  .login-card h2{margin:0 0 4px;font-size:21px;font-weight:800;color:var(--navy-dark);}
  .login-card p{margin:0 0 22px;font-size:13.5px;color:var(--muted);}
  .login-btn{width:100%;padding:14px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--amber) 0%,var(--amber-dark) 100%);border:none;border-radius:10px;cursor:pointer;margin-top:6px;}
  .login-btn:disabled{background:#C9CDD2;}
  #loginMsg{margin-top:12px;font-size:13.5px;text-align:center;color:var(--err);font-weight:700;min-height:16px;}

  .subtabs{display:flex;gap:8px;margin-bottom:16px;}
  .subtab-btn{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--navy-dark);font-size:13px;font-weight:700;cursor:pointer;}
  .subtab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .admin-item{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .admin-item .row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .admin-item .title{font-weight:800;font-size:14.5px;}
  .admin-item .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .admin-item .btns{display:flex;gap:6px;}
  .icon-btn{padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--navy-dark);}
  .icon-btn.danger{color:var(--err);border-color:#F3C7C7;}
  .add-btn{width:100%;padding:11px;border:none;border-radius:9px;background:var(--navy);color:#fff;font-weight:800;font-size:13.5px;cursor:pointer;margin-top:4px;}
  .edit-form{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .edit-form .row2{margin-bottom:8px;}
  .save-row{display:flex;gap:8px;margin-top:4px;}
  .save-row button{flex:1;padding:9px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;}
  .save-row .save{background:var(--ok);color:#fff;}
  .save-row .cancel{background:#eee;color:var(--text);}
  .reorder-flag{color:var(--err);font-weight:800;font-size:11.5px;}
  .mini-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin-bottom:4px;display:block;}
  .field-block{margin-bottom:0;}
  .excel-row{display:flex;gap:8px;margin-bottom:14px;}
  .excel-btn{flex:1;padding:10px;border-radius:9px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:800;font-size:12.5px;cursor:pointer;text-align:center;}
  .excel-btn.import{position:relative;overflow:hidden;}
  .excel-btn.import input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .import-msg{font-size:12px;font-weight:700;margin-bottom:10px;text-align:center;min-height:16px;}
  .import-msg.ok{color:var(--ok);}
  .import-msg.err{color:var(--err);}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h2>Lead Form Login</h2>
    <p>Enter your Login ID and Password to continue.</p>
    <div class="field">
      <label>Login ID</label>
      <input type="text" id="loginId" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button type="button" class="login-btn" id="loginBtn">Login</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="appScreen" class="hidden">
<header>
  <button type="button" class="logout-btn" id="logoutBtn">Logout</button>
  <div class="tag">RPGH &middot; LEAD CAPTURE</div>
  <h1 id="pageTitle">Lead Form</h1>
  <div class="tabs" id="mainTabs">
    <button type="button" class="tab-btn active" id="tabFormBtn">New Lead</button>
    <button type="button" class="tab-btn" id="tabDashBtn">My Dashboard</button>
    <button type="button" class="tab-btn hidden" id="tabAdminBtn">Admin</button>
  </div>
</header>
<main>

  <section id="formSection">
    <div class="card">
      <form id="leadForm">
        <div class="section-title">Customer Details</div>
        <div class="field">
          <label>Customer Name <span class="req">*</span></label>
          <input type="text" id="name" required>
        </div>
        <div class="field">
          <label>Phone Number <span class="req">*</span></label>
          <input type="tel" id="phone" inputmode="numeric" required>
        </div>
        <div class="field">
          <label>Lead Source</label>
          <select id="source">
            <option value="Walk-in">Walk-in</option>
            <option value="Phone">Phone</option>
            <option value="WhatsApp" selected>WhatsApp</option>
            <option value="Website">Website</option>
            <option value="Referral">Referral</option>
            <option value="Social Media">Social Media</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="section-title">Product Details</div>
        <div class="field">
          <label>Product / Item</label>
          <select id="product">
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="field">
          <label>Product Description</label>
          <textarea id="productDesc" placeholder="Additional details about the item..."></textarea>
        </div>
        <div class="row2">
          <div class="field">
            <label>Expected Value (Rs.)</label>
            <input type="number" id="value" inputmode="numeric" placeholder="0">
          </div>
          <div class="field">
            <label>Assign To</label>
            <select id="assignedTo">
              <option value="">Loading...</option>
            </select>
          </div>
        </div>

        <div class="section-title">Additional Notes</div>
        <div class="field">
          <textarea id="notes" placeholder="Any additional information..."></textarea>
        </div>
      </form>
      <div id="status"></div>
      <a href="#" id="waBtn" target="_blank">Send WhatsApp to Customer</a>
    </div>
  </section>

  <section id="dashSection" class="hidden">
    <div id="dashSummary"></div>
    <div id="dashList"></div>
  </section>

  <section id="adminSection" class="hidden">
    <div class="subtabs">
      <button type="button" class="subtab-btn active" id="subLeadsBtn">All Leads</button>
      <button type="button" class="subtab-btn" id="subUsersBtn">Users</button>
      <button type="button" class="subtab-btn" id="subInventoryBtn">Inventory</button>
    </div>

    <div id="adminLeadsPanel"></div>
    <div id="adminUsersPanel" class="hidden"></div>
    <div id="adminInventoryPanel" class="hidden"></div>
  </section>

</main>
<div class="footer-bar" id="footerBar">
  <div class="footer-bar-inner">
    <button id="submitBtn" type="submit" form="leadForm">Save Lead</button>
  </div>
</div>
</div>

<script>
  const SUPABASE_URL = "https://wnorbyaeikvusdzesbkt.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l9_ENeEmiv59DJta1I8BGA_b7W7PXWV";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const loginId = document.getElementById('loginId');
  const loginPass = document.getElementById('loginPass');
  const loginBtn = document.getElementById('loginBtn');
  const loginMsg = document.getElementById('loginMsg');
  const logoutBtn = document.getElementById('logoutBtn');
  let currentUser = null;

  function showApp(user){
    currentUser = user;
    loginScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
    const hasAnyAdminPerm = user.role === 'admin' || user.perm_leads || user.perm_users || user.perm_inventory;
    if (hasAnyAdminPerm) {
      document.getElementById('tabAdminBtn').classList.remove('hidden');
    }
    initApp();
    loadDashboard();
  }

  async function doLogin(){
    const id = loginId.value.trim();
    const pass = loginPass.value.trim();
    if (!id || !pass) { loginMsg.textContent = 'Please enter both Login ID and Password.'; return; }
    loginBtn.disabled = true;
    loginBtn.textContent = 'Checking...';
    loginMsg.textContent = '';

    const { data, error } = await sb
      .from('users')
      .select('name, mobile, email, department, role, perm_leads, perm_users, perm_inventory')
      .eq('login_id', id)
      .eq('password', pass)
      .maybeSingle();

    loginBtn.disabled = false;
    loginBtn.textContent = 'Login';

    if (error) { loginMsg.textContent = 'Error: ' + error.message; return; }
    if (!data) { loginMsg.textContent = 'Invalid Login ID or Password'; return; }
    localStorage.setItem('leadapp_user', JSON.stringify(data));
    showApp(data);
  }

  loginBtn.addEventListener('click', doLogin);
  loginPass.addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });

  logoutBtn.addEventListener('click', function(){
    localStorage.removeItem('leadapp_user');
    currentUser = null;
    appScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
    loginId.value = ''; loginPass.value = '';
  });

  const saved = localStorage.getItem('leadapp_user');
  if (saved) { try { showApp(JSON.parse(saved)); } catch (e) {} }

  let appInitialized = false;
  let usersListGlobal = [];
  let itemsListGlobal = [];
  let stepsListGlobal = ['New Lead','Contacted','Site Visit','Quotation','Converted'];

  function initApp(){
    if (appInitialized) return;
    appInitialized = true;

    const tabFormBtn = document.getElementById('tabFormBtn');
    const tabDashBtn = document.getElementById('tabDashBtn');
    const tabAdminBtn = document.getElementById('tabAdminBtn');
    const formSection = document.getElementById('formSection');
    const dashSection = document.getElementById('dashSection');
    const adminSection = document.getElementById('adminSection');
    const footerBar = document.getElementById('footerBar');
    const pageTitle = document.getElementById('pageTitle');

    function activateTab(which){
      [tabFormBtn, tabDashBtn, tabAdminBtn].forEach(b => b.classList.remove('active'));
      [formSection, dashSection, adminSection].forEach(s => s.classList.add('hidden'));
      footerBar.classList.add('hidden');
      if (which === 'form') {
        tabFormBtn.classList.add('active'); formSection.classList.remove('hidden');
        footerBar.classList.remove('hidden'); pageTitle.textContent = 'Lead Form';
      } else if (which === 'dash') {
        tabDashBtn.classList.add('active'); dashSection.classList.remove('hidden');
        pageTitle.textContent = 'My Dashboard'; loadDashboard();
      } else if (which === 'admin') {
        tabAdminBtn.classList.add('active'); adminSection.classList.remove('hidden');
        pageTitle.textContent = 'Admin Panel'; setupAdminSubtabs();
      }
    }
    tabFormBtn.addEventListener('click', function(){ activateTab('form'); });
    tabDashBtn.addEventListener('click', function(){ activateTab('dash'); });
    tabAdminBtn.addEventListener('click', function(){ activateTab('admin'); });

    const form = document.getElementById('leadForm');
    const btn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');
    const assignSelect = document.getElementById('assignedTo');
    const productSelect = document.getElementById('product');
    const waBtn = document.getElementById('waBtn');

    function fillAssignDropdown(users){
      usersListGlobal = users;
      assignSelect.innerHTML = '<option value="">-- Select --</option>' +
        users.map(u => '<option value="' + u.name + '">' + u.name + '</option>').join('');
    }
    function fillProductDropdown(items){
      itemsListGlobal = items;
      productSelect.innerHTML = '<option value="">-- Select --</option>' +
        items.map(it => '<option value="' + it.name + '">' + it.name + ' (Stock: ' + it.stock + ')</option>').join('');
    }
    productSelect.addEventListener('change', function(){
      const item = itemsListGlobal.find(it => it.name === productSelect.value);
      if (!item || !item.department) return;
      const match = usersListGlobal.find(u => u.department === item.department);
      if (match) assignSelect.value = match.name;
    });

    async function loadUsers(){
      const { data } = await sb.from('users').select('name, mobile, email, department, role');
      if (data) fillAssignDropdown(data);
    }
    async function loadItems(){
      const { data: items } = await sb.from('inventory').select('id, item_name, department');
      const { data: txns } = await sb.from('stock_transactions').select('item_id, type, quantity');
      if (items) {
        const stockMap = {};
        (txns || []).forEach(function(t){
          const q = Number(t.quantity) || 0;
          stockMap[t.item_id] = (stockMap[t.item_id] || 0) + (t.type === 'sale' ? -q : q);
        });
        fillProductDropdown(items.map(function(r){
          return { name: r.item_name, stock: stockMap[r.id] || 0, department: r.department };
        }));
      }
    }
    async function loadSteps(){
      const { data } = await sb.from('steps').select('step_name').order('step_order', { ascending: true });
      if (data && data.length) stepsListGlobal = data.map(r => r.step_name);
    }
    loadUsers(); loadItems(); loadSteps();

    function toWaNumber(num){
      num = (num || '').toString().replace(/\D/g,'');
      if (num.length === 10) return '91' + num;
      return num;
    }
    let waStage = 0, custLink = '', userLink = '';
    waBtn.addEventListener('click', function(){
      setTimeout(function(){
        if (waStage === 0 && userLink) {
          waStage = 1; waBtn.textContent = 'Send WhatsApp to User'; waBtn.href = userLink;
        } else { waBtn.style.display = 'none'; }
      }, 400);
    });

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      statusEl.textContent = ''; statusEl.className = ''; waBtn.style.display = 'none';

      const payload = {
        customer_name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        source: document.getElementById('source').value,
        product: productSelect.value,
        product_desc: document.getElementById('productDesc').value.trim(),
        status: 'New Lead',
        assigned_to: assignSelect.value,
        expected_value: document.getElementById('value').value || null,
        notes: document.getElementById('notes').value.trim()
      };
      if (!payload.customer_name || !payload.phone) {
        statusEl.textContent = 'Name and Phone Number are required.'; statusEl.className = 'err'; return;
      }
      btn.disabled = true; btn.textContent = 'Saving...';

      const { data: inserted, error: insErr } = await sb.from('leads').insert(payload).select().single();
      if (insErr) {
        statusEl.textContent = 'Error: ' + insErr.message; statusEl.className = 'err';
        btn.disabled = false; btn.textContent = 'Save Lead'; return;
      }
      await sb.from('lead_log').insert({ lead_id: inserted.id, step: 'New Lead', updated_by: payload.assigned_to, description: payload.notes });

      statusEl.textContent = 'Lead saved successfully!'; statusEl.className = 'ok';
      btn.disabled = false; btn.textContent = 'Save Lead';

      const custMsg = 'Hello ' + payload.customer_name + ', thank you for contacting us' + (payload.product ? (' regarding ' + payload.product) : '') + '. We will get in touch with you shortly.';
      custLink = 'https://wa.me/' + toWaNumber(payload.phone) + '?text=' + encodeURIComponent(custMsg);
      const assignedUser = usersListGlobal.find(u => u.name === payload.assigned_to);
      userLink = '';
      if (assignedUser && assignedUser.mobile) {
        const userMsg = 'A new lead has been assigned to you:\nName: ' + payload.customer_name + '\nPhone: ' + payload.phone + '\nProduct: ' + payload.product + (payload.product_desc ? ('\nDescription: ' + payload.product_desc) : '') + '\nValue: Rs.' + payload.expected_value + '\nSource: ' + payload.source + (payload.notes ? ('\nNotes: ' + payload.notes) : '');
        userLink = 'https://wa.me/' + toWaNumber(assignedUser.mobile) + '?text=' + encodeURIComponent(userMsg);
      }
      waStage = 0; waBtn.textContent = 'Send WhatsApp to Customer'; waBtn.href = custLink; waBtn.style.display = 'flex';

      form.reset(); document.getElementById('source').value = 'WhatsApp';
      statusEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // ============ ADMIN PANEL ============
    const subLeadsBtn = document.getElementById('subLeadsBtn');
    const subUsersBtn = document.getElementById('subUsersBtn');
    const subInventoryBtn = document.getElementById('subInventoryBtn');
    const adminLeadsPanel = document.getElementById('adminLeadsPanel');
    const adminUsersPanel = document.getElementById('adminUsersPanel');
    const adminInventoryPanel = document.getElementById('adminInventoryPanel');

    function activateSub(which){
      [subLeadsBtn, subUsersBtn, subInventoryBtn].forEach(b => b.classList.remove('active'));
      [adminLeadsPanel, adminUsersPanel, adminInventoryPanel].forEach(p => p.classList.add('hidden'));
      if (which === 'leads') { subLeadsBtn.classList.add('active'); adminLeadsPanel.classList.remove('hidden'); loadAdminLeads(); }
      if (which === 'users') { subUsersBtn.classList.add('active'); adminUsersPanel.classList.remove('hidden'); loadAdminUsers(); }
      if (which === 'inventory') { subInventoryBtn.classList.add('active'); adminInventoryPanel.classList.remove('hidden'); loadAdminInventory(); }
    }
    subLeadsBtn.addEventListener('click', function(){ activateSub('leads'); });
    subUsersBtn.addEventListener('click', function(){ activateSub('users'); });
    subInventoryBtn.addEventListener('click', function(){ activateSub('inventory'); });

    function setupAdminSubtabs(){
      const canLeads = currentUser.role === 'admin' || currentUser.perm_leads;
      const canUsers = currentUser.role === 'admin' || currentUser.perm_users;
      const canInventory = currentUser.role === 'admin' || currentUser.perm_inventory;
      subLeadsBtn.classList.toggle('hidden', !canLeads);
      subUsersBtn.classList.toggle('hidden', !canUsers);
      subInventoryBtn.classList.toggle('hidden', !canInventory);
      if (canLeads) activateSub('leads');
      else if (canUsers) activateSub('users');

    function loadXLSXLib(){
      return new Promise(function(resolve, reject){
        if (window.XLSX) return resolve();
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
        s.onload = function(){ resolve(); };
        s.onerror = function(){ reject(new Error('Failed to load Excel library')); };
        document.head.appendChild(s);
      });
    }

    async function exportToExcel(data, filename, sheetName){
      if (!data || !data.length) { alert('No data to export.'); return; }
      await loadXLSXLib();
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, filename);
    }

    function readExcelFile(file, callback){
      loadXLSXLib().then(function(){
        const reader = new FileReader();
        reader.onload = function(e){
          const wb = XLSX.read(e.target.result, { type: 'binary' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws);
          callback(rows);
        };
        reader.readAsBinaryString(file);
      }).catch(function(err){
        alert(err.message);
      });
    }

          msgEl.textContent = error.message; msgEl.className = 'lead-msg err'; return;
        }
        await sb.from('lead_log').insert({ lead_id: leadId, step: newStatus, updated_by: currentUser.name, description: desc });
        updBtn.disabled = false; updBtn.textContent = 'Update & Move Forward';
        msgEl.textContent = 'Updated successfully!'; msgEl.className = 'lead-msg ok';
        loadDashboard();
      });
    });
  };

  async function loadDashboard(){
    if (!currentUser) return;
    const dashList = document.getElementById('dashList');
    if (dashList) dashList.innerHTML = '<p style="text-align:center;color:#7C8B99;">Loading...</p>';
    const { data, error } = await sb.from('leads').select('*').eq('assigned_to', currentUser.name).order('created_at', { ascending: false });
    if (!error && window.renderDashboard) window.renderDashboard(data || []);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  }
</script>
</body>
</html>
